<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta viewport="width=device-width, initial-scale=1.0">
    <title>Patinhas ‒ Adotar</title>
    <link rel="stylesheet" href="../css/adotar.css">
    <link rel="shortcut icon" href="../images/patinha.png" type="image/png">
    <link rel='stylesheet' href='//cdn.jsdelivr.net/npm/hack-font@3.3.0/build/web/hack.css'>
</head>
<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="../images/patinha.png">
            <h1>Patinhas</h1>
        </div>

        <nav>
            <ul>
                <li><a href="../index.html">Início</a></li>
                <li><a href="adotar.html" class="ativo">Adotar</a></li>
                <li><a href="protetor.html">Área do Protetor</a></li>
            </ul>
        </nav>

        <a href="#" class="btn-apoie">
            <img src="../images/coracao-ativo.png">
            <span>Apoie patinhas</span>
        </a>
    </header>
    
    <main>
        <article>
            <header class="pets-info"> 
                <h1>Pets disponíveis para adoção</h1>
                <p>Encontre o companheiro perfeito para sua família</p>
            </header>

            <form>
                <div class="campo-busca">
                    <img src="../images/busca.png">
                    <input type="search" name="busca" placeholder="Buscar por nome ou raça...">
                </div>
                <label>Espécie</label>
                <select>
                    <option value="">Todos</option>
                    <option value="cachorro">Cachorro</option>
                    <option value="gato">Gato</option>
                    <option value="dragao">Dragão</option>
                </select>
                <label>Porte</label>
                <select>
                    <option value="">Todos</option>
                    <option value="pequeno">Pequeno</option>
                    <option value="medio">Médio</option>
                    <option value="grande">Grande</option>
                </select>
            </form>

        </article>
    </main>
